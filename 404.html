<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — MoonXstudios</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#242220" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #242220; color: #d6d2cb; font-family: "Montserrat", Arial, sans-serif;
      display: flex; flex-direction: column; padding: 28px clamp(20px, 4vw, 64px);
    }
    header, footer { display: flex; justify-content: space-between; font-size: 15px; }
    main { flex: 1; display: grid; place-content: center; text-align: center; gap: 20px; }
    h1 {
      font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; line-height: .85;
      font-size: clamp(140px, 32vw, 420px); letter-spacing: .01em;
    }
    h1 span { color: transparent; -webkit-text-stroke: 2px #d6d2cb; }
    h1 span { display: inline-block; animation: float 3s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-14px); } }
    p { color: #a7a29a; }
    a.pill {
      justify-self: center; display: inline-block; margin-top: 8px; padding: 13px 34px;
      border: 1.5px solid #d6d2cb; border-radius: 999px; color: inherit; text-decoration: none;
      font-size: 13px; letter-spacing: .06em; text-transform: uppercase; transition: background .4s, color .4s;
    }
    a.pill:hover { background: #d6d2cb; color: #242220; }
    @media (prefers-reduced-motion: reduce) { h1 span { animation: none; } }
  </style>
</head>
<body>
  <header><span>MoonXstudios</span><span>Lost in orbit</span></header>
  <main>
    <h1>4<span>0</span>4</h1>
    <p>This page drifted off. Let's get you back.</p>
    <a class="pill" id="home" href="/">Back to home</a>
  </main>
  <script>
    // On GitHub Pages project sites the site lives at /<repo>/, not at /
    (function () {
      var base = "/";
      if (/\.github\.io$/.test(location.hostname)) {
        var seg = location.pathname.split("/")[1];
        if (seg) base = "/" + seg + "/";
      }
      document.getElementById("home").href = base;
      document.querySelector('link[rel="icon"]').href = base + "favicon.svg";
    })();
  </script>
  <footer><span>Social media manager</span><span>Your digital helper</span></footer>
</body>
</html>
